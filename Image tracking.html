<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const target = document.querySelector("#myTarget");
        const video = document.querySelector("#attachedvideo");

        target.addEventListener("targetFound", () => {
          video.currentTime = 0; 
        });

        target.addEventListener("targetLost", () => {
          video.pause();
        });
      });
    </script>
  </head>

  <body>
    <a-scene 
      mindar-image="imageTargetSrc: /assets for keeper/targets (4).mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video 
          id="attachedvideo" src="/assets for keeper/changli summon.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline>
        </video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="myTarget" mindar-image-target="targetIndex: 0">
        <a-video 
          src="#attachedvideo" position="0 0 0.1" width="1.6" height="0.9" rotation="0 0 0">
        </a-video>
      </a-entity>
    </a-scene>
  </body>
</html>
